services:
  postgres:
    image: postgres:16
    container_name: mydubai_postgres
    restart: always
    environment:
      POSTGRES_USER: mydubai
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: mydubai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mydubai_backend
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    # command: >
    #   sh -c "pnpm prisma generate &&
    #          pnpm dev"

volumes:
  postgres_data:


